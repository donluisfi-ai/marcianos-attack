<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#101020"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Marcianos Attack</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#080b17;color:#fff;font-family:system-ui,Arial,sans-serif;overflow:hidden;touch-action:manipulation}#app{height:100dvh;display:flex;flex-direction:column;align-items:center;background:radial-gradient(ellipse at 50% 25%,#222344,#080b17 75%)}header{width:min(100%,650px);min-height:44px;display:flex;align-items:center;justify-content:space-between;padding:7px 12px;gap:8px}header strong{color:#ff9b2e;letter-spacing:1px;font-size:clamp(14px,3.5vw,21px)}#hud{font-size:12px;color:#ffce93;text-align:right}#stage{width:min(100vw,650px);flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}canvas{display:block;width:100%;height:100%;object-fit:contain;touch-action:none}#overlay{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(5,7,19,.96);overflow-y:auto}#overlay.hidden{display:none}#panel{width:100%;max-width:600px;max-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;text-align:center}h1{color:#ff9c30;text-shadow:3px 3px #762a1c;font-size:clamp(25px,6vw,40px);margin:0}h2{margin:0;font-size:clamp(18px,4.5vw,26px)}p{margin:0;line-height:1.35}button{border:0;border-radius:10px;background:#ff9b31;color:#1b1620;font-weight:900;font-size:15px;padding:12px 18px;cursor:pointer}button.secondary{background:#26324b;color:#fff;border:1px solid #5a6b8a}#controls{width:min(100%,650px);height:80px;display:flex;justify-content:space-around;gap:10px;padding:7px 14px;flex-shrink:0}#controls button{flex:1;max-width:170px;touch-action:none;user-select:none;font-size:22px}#controls #fire{background:#ef6436;font-size:17px}.comic{width:100%;height:auto;max-height:min(67dvh,600px);object-fit:contain;border:3px solid #ff9b30;border-radius:5px}.comic-tip{font-size:12px;color:#d5d7e5}.heroes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}.hero{background:#1b263d;color:#fff;border:2px solid #4c5b76;min-height:102px;padding:7px 3px;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}.hero.active{border-color:#ffa83c;background:#513426}.hero svg{width:58px;height:62px}.sub{font-size:12px;color:#c4cad8}.action-row{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}.final-art{width:min(100%,530px);border:3px solid #ffac41;border-radius:5px;background:linear-gradient(140deg,#fb7b26,#1d1b3c 75%);padding:15px;display:flex;align-items:center;gap:12px}.final-art .bubble{background:#fff6c6;color:#17151b;border:3px solid #16141a;border-radius:30px;padding:12px 10px;font-size:clamp(14px,3.5vw,21px);font-weight:1000;flex:1}.final-art svg{width:40%;max-height:230px}.badge{color:#ffce84;font-weight:bold;font-size:13px}#stage:focus{outline:none}@media(min-width:750px){#controls{height:70px}}@media(max-height:580px){.heroes{gap:4px}.hero{min-height:70px}.hero svg{height:39px;width:40px}#panel{gap:5px}.comic{max-height:59dvh}}
</style></head><body><div id="app"><header><strong>👾 MARCIANOS ATTACK</strong><div id="hud">MACEDOR · LISTO</div></header><div id="stage" tabindex="0"><canvas id="game" width="400" height="600"></canvas><div id="overlay"><div id="panel"></div></div></div><div id="controls"><button id="left" aria-label="Mover izquierda">◀</button><button id="fire" aria-label="Disparar">🔥 FUEGO</button><button id="right" aria-label="Mover derecha">▶</button></div></div><script>
'use strict';
const HEROES=[{id:'pres',name:'Padre Pres.',weapon:'Cañón parroquial',shot:'cannon',color:'#dfb15f'},{id:'hidalgo',name:'Hidalgo',weapon:'Lanza manchega',shot:'spear',color:'#d8c4a0'},{id:'dracula',name:'Drácula Canoso',weapon:'Murciélagos',shot:'bat',color:'#bb77dc'},{id:'shark',name:'El Tiburón',weapon:'Torpedos',shot:'torpedo',color:'#68c6e9'},{id:'doctor',name:'El Médico',weapon:'Jeringas láser',shot:'syringe',color:'#91e6bd'},{id:'takel',name:'TAKELPERRY',weapon:'Plasma policial',shot:'plasma',color:'#8ca9f8'}];
const $=id=>document.getElementById(id), cv=$('game'),ctx=cv.getContext('2d'),panel=$('panel'),overlay=$('overlay'),hud=$('hud');
let mode='intro',comic=0,chosen=0,phase=1,score=0,lives=3,heroX=200,bullets=[],enemyBullets=[],enemies=[],particles=[],boss=null,last=0,fireDelay=0,enemyDir=1,phaseTime=0,invincible=0,spawnedBoss=false,muted=false,keys={left:false,right:false,fire:false},stars=Array.from({length:65},(_,i)=>({x:(i*79+29)%400,y:(i*131+17)%600,r:i%4===0?1.6:.8}));
function show(html){panel.innerHTML=html;overlay.classList.remove('hidden')}function hide(){overlay.classList.add('hidden')}function heroSvg(id){let base={pres:['#22232e','#e9b68e','<path d="M35 47v19 M27 55h16" stroke="#e7c677" stroke-width="3"/><path d="M50 59L73 44l5 9-23 19Z" fill="#b98550"/>'],hidalgo:['#8d7962','#d8aa85','<path d="M18 18L40 2l22 16Z" fill="#b5b9c2"/><path d="M63 81L68 6" stroke="#ddd3b7" stroke-width="4"/><path d="M64 12l4-12 4 12Z" fill="#eee"/>'],dracula:['#59254a','#e6dbd9','<path d="M20 27Q14 0 33 8l7 11 7-11q19-8 13 19L51 18l-7 7-4-8-4 8-7-7Z" fill="white"/><path d="M31 44l6 9 3-7 3 7 6-9" fill="white"/>'],shark:['#69aeca','#d5e6ed','<path d="M8 49Q8 27 38 28l10-23 9 27q17 10 16 30L60 80H20Z" fill="#78bbd3"/><path d="M24 60l30 0-15 18Z" fill="#24364b"/><path d="M25 60l7 7 7-7 7 7 7-7" fill="none" stroke="white" stroke-width="3"/>'],doctor:['#e6f0ef','#e7b68f','<path d="M40 49v31" stroke="#8bb3bb" stroke-width="2"/><path d="M24 57v15q0 10 13 10" fill="none" stroke="#537687" stroke-width="3"/><circle cx="37" cy="82" r="4" fill="#537687"/><path d="M54 56v18m-9-9h18" stroke="#d94f57" stroke-width="4"/>'],takel:['#365a91','#d9ab87','<path d="M18 21l6-14h32l6 14Z" fill="#263c70"/><rect x="17" y="20" width="46" height="7" rx="3" fill="#45639b"/><path d="M53 55h9v12l-5 5-4-5Z" fill="#e6bd65"/>']}[id];return `<svg viewBox="0 0 80 88" xmlns="http://www.w3.org/2000/svg" aria-label="${id}"><path d="M12 88L18 50Q40 36 62 50L68 88Z" fill="${base[0]}"/><circle cx="40" cy="31" r="17" fill="${base[1]}"/><path d="M24 24Q23 7 40 8Q57 7 56 24" fill="${id==='dracula'?'#eee':'#41383c'}"/><circle cx="34" cy="32" r="2"/><circle cx="46" cy="32" r="2"/>${base[2]}</svg>`}
function comicScreen(){mode='intro';let i=comic+1;show(`<img class="comic" src="vineta-${i}.webp" alt="Viñeta ${i} de la invasión marciana"><div class="comic-tip">VIÑETA ${i}/5 · Toca la imagen o pulsa ENTER para continuar</div><div class="action-row"><button id="next">${i===5?'ELEGIR HÉROE':'SIGUIENTE ▶'}</button><button class="secondary" id="skip">SALTAR INTRODUCCIÓN</button></div>`);$('next').onclick=nextComic;$('skip').onclick=chooseHero;panel.querySelector('img').onclick=nextComic}
function nextComic(){if(mode!=='intro')return;if(comic<4){comic++;comicScreen()}else chooseHero()}
function chooseHero(){mode='select';show(`<h1>ELIGE A TU HÉROE</h1><p class="sub">Seis defensores de Sevilla contra los ovnis naranjas</p><div class="heroes">${HEROES.map((h,i)=>`<button class="hero ${i===chosen?'active':''}" data-i="${i}">${heroSvg(h.id)}<span>${h.name}</span></button>`).join('')}</div><p id="heroWeapon" class="badge">${HEROES[chosen].weapon}</p><button id="start">🚀 ¡DEFENDER SEVILLA!</button><p class="sub">Móvil: ◀ ▶ y FUEGO · Ordenador: ← → y espacio</p>`);panel.querySelectorAll('.hero').forEach(b=>b.onclick=()=>{chosen=+b.dataset.i;panel.querySelectorAll('.hero').forEach(x=>x.classList.toggle('active',x===b));$('heroWeapon').textContent=HEROES[chosen].weapon});$('start').onclick=startGame}
function startGame(){phase=1;score=0;lives=3;heroX=200;beginPhase()}
function beginPhase(){mode='playing';bullets=[];enemyBullets=[];particles=[];boss=null;spawnedBoss=false;enemyDir=1;phaseTime=0;fireDelay=0;invincible=1.5;enemies=[];let rows=phase===1?3:phase===2?4:phase===3?4:3,cols=phase===4?6:7;for(let r=0;r<rows;r++)for(let c=0;c<cols;c++)enemies.push({x:48+c*(305/(cols-1)),y:72+r*37,alive:true,hp:phase===3&&r===0?2:1});hide();hud.textContent=`FASE ${phase}/4 · ${score} PTS · ${'♥'.repeat(lives)}`}
function phaseComplete(){if(phase===4){victory();return}mode='intermission';show(`<h1>¡FASE ${phase} SUPERADA!</h1><h2>${score} puntos</h2><p>Los marcianos vuelven con refuerzos...</p><button id="continue">CONTINUAR A FASE ${phase+1} ▶</button>`);$('continue').onclick=()=>{phase++;beginPhase()}}
function gameOver(){mode='over';show(`<h1>FIN DE LA PARTIDA</h1><h2>🏆 ${score} puntos</h2><p>Sevilla necesita otra oportunidad.</p><div class="action-row"><button id="again">REINTENTAR</button><button class="secondary" id="heroes">CAMBIAR HÉROE</button></div>`);$('again').onclick=startGame;$('heroes').onclick=chooseHero}
function victory(){mode='victory';let h=HEROES[chosen];let best=Number(localStorage.getItem('marcianos-record')||0);if(score>best)localStorage.setItem('marcianos-record',String(score));show(`<h1>¡SEVILLA SE HA SALVADO!</h1><div class="final-art">${heroSvg(h.id)}<div class="bubble">¡MUERDE EL POLVO, ZORRA PELIRROJA!</div></div><p><strong>${h.name}</strong> ha derrotado al marciano de Macedor.</p><p class="badge">🏆 ${score} PUNTOS · RÉCORD ${Math.max(score,best)}</p><div class="action-row"><button id="again">VOLVER A JUGAR</button><button class="secondary" id="heroes">ELEGIR OTRO HÉROE</button></div>`);$('again').onclick=startGame;$('heroes').onclick=chooseHero}
function hitHero(){if(invincible>0)return;lives--;invincible=1.8;explode(heroX,538,'#fff',22);if(lives<=0)gameOver()}
function explode(x,y,color,n=12){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,s=40+Math.random()*100;particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.4+Math.random()*.4,color})}}
function shoot(){if(mode!=='playing'||fireDelay>0)return;fireDelay=.19;bullets.push({x:heroX,y:519,vy:-430,shot:HEROES[chosen].shot});}
function update(dt){if(mode!=='playing')return;phaseTime+=dt;fireDelay=Math.max(0,fireDelay-dt);invincible=Math.max(0,invincible-dt);if(keys.left)heroX-=255*dt;if(keys.right)heroX+=255*dt;heroX=Math.max(24,Math.min(376,heroX));if(keys.fire)shoot();bullets.forEach(b=>b.y+=b.vy*dt);enemyBullets.forEach(b=>{b.y+=b.vy*dt;b.x+=(b.vx||0)*dt});bullets=bullets.filter(b=>b.y>-20);enemyBullets=enemyBullets.filter(b=>b.y<620);particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});particles=particles.filter(p=>p.life>0);
if(boss){boss.x+=boss.vx*dt;if(boss.x<55||boss.x>345)boss.vx*=-1;boss.cool-=dt;if(boss.cool<=0){boss.cool=.75;for(let a=-1;a<=1;a++)enemyBullets.push({x:boss.x,y:boss.y+35,vy:180+phase*20,vx:a*75})}for(let b of bullets){if(Math.abs(b.x-boss.x)<49&&Math.abs(b.y-boss.y)<37){b.y=-100;boss.hp--;explode(b.x,boss.y,'#ff9a28',3);score+=20;if(boss.hp<=0){explode(boss.x,boss.y,'#ff9a28',60);boss=null;victory();return}}}}
else{let alive=enemies.filter(e=>e.alive);if(alive.length===0){if(phase===4&&!spawnedBoss){spawnedBoss=true;boss={x:200,y:110,vx:110,hp:36,cool:1};}else phaseComplete();return}let speed=(16+phase*9+Math.max(0,21-alive.length)*.7)*enemyDir;let edge=false;for(let e of alive){e.x+=speed*dt;if(e.x<22||e.x>378)edge=true}if(edge){enemyDir*=-1;for(let e of alive)e.y+=12}if(Math.random()<dt*(.35+phase*.22)){let e=alive[Math.floor(Math.random()*alive.length)];enemyBullets.push({x:e.x,y:e.y+15,vy:165+phase*23})}for(let e of alive){if(e.y>520){hitHero();e.alive=false}for(let b of bullets){if(b.y>-10&&Math.abs(b.x-e.x)<16&&Math.abs(b.y-e.y)<13){b.y=-100;e.hp--;if(e.hp<=0){e.alive=false;score+=10;explode(e.x,e.y,'#ff9d30',9)}}}}}
for(let b of enemyBullets){if(Math.abs(b.x-heroX)<19&&Math.abs(b.y-541)<17){b.y=700;hitHero()}}hud.textContent=`FASE ${phase}/4 · ${score} PTS · ${'♥'.repeat(Math.max(0,lives))}`}
function drawAlien(x,y,scale=1){ctx.save();ctx.translate(x,y);ctx.scale(scale,scale);ctx.fillStyle='#ff8d25';ctx.fillRect(-13,-9,26,16);ctx.fillRect(-9,-13,18,4);ctx.fillRect(-18,-4,36,9);ctx.fillStyle='#ffd37a';ctx.fillRect(-10,-4,7,5);ctx.fillRect(3,-4,7,5);ctx.fillStyle='#392237';ctx.fillRect(-7,-3,4,4);ctx.fillRect(5,-3,4,4);ctx.fillStyle='#ff8d25';ctx.fillRect(-12,7,5,4);ctx.fillRect(7,7,5,4);ctx.restore()}
function drawBoss(){if(!boss)return;let {x,y}=boss;ctx.save();ctx.translate(x,y);ctx.fillStyle='#a5e650';ctx.beginPath();ctx.ellipse(0,0,45,35,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff8124';for(let i=-3;i<=3;i++){ctx.beginPath();ctx.moveTo(i*12,-22);ctx.lineTo(i*12-7,-54-Math.abs(i)*2);ctx.lineTo(i*12+9,-26);ctx.fill()}ctx.fillStyle='#1c2b1e';ctx.beginPath();ctx.ellipse(-17,-5,10,12,0,0,Math.PI*2);ctx.ellipse(17,-5,10,12,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ffdc57';ctx.fillRect(-21,-10,8,8);ctx.fillRect(13,-10,8,8);ctx.fillStyle='#4c0e23';ctx.fillRect(-16,16,32,10);ctx.fillStyle='white';for(let i=-1;i<=1;i++)ctx.fillRect(i*9-2,16,5,6);ctx.restore();ctx.fillStyle='#431923';ctx.fillRect(85,23,230,10);ctx.fillStyle='#ff9a2e';ctx.fillRect(85,23,230*(boss.hp/36),10);ctx.fillStyle='white';ctx.font='bold 12px monospace';ctx.textAlign='center';ctx.fillText('JEFE FINAL: MACEDOR',200,19)}
function drawHero(){let h=HEROES[chosen];ctx.save();ctx.translate(heroX,541);if(invincible>0&&Math.floor(invincible*8)%2===0)ctx.globalAlpha=.4;ctx.fillStyle=h.color;ctx.beginPath();ctx.moveTo(0,-25);ctx.lineTo(24,14);ctx.lineTo(18,25);ctx.lineTo(-18,25);ctx.lineTo(-24,14);ctx.closePath();ctx.fill();ctx.fillStyle='#1b233a';ctx.fillRect(-12,4,24,12);ctx.fillStyle='#fff';ctx.fillRect(-8,0,5,4);ctx.fillRect(3,0,5,4);if(h.id==='dracula'){ctx.fillStyle='#fff';ctx.fillRect(-17,-19,34,8);ctx.fillRect(-13,-25,26,7)}else if(h.id==='hidalgo'){ctx.fillStyle='#aab6c6';ctx.beginPath();ctx.moveTo(-15,-15);ctx.lineTo(0,-36);ctx.lineTo(15,-15);ctx.fill()}else if(h.id==='shark'){ctx.fillStyle='#d4edf1';ctx.beginPath();ctx.moveTo(-13,-3);ctx.lineTo(0,10);ctx.lineTo(13,-3);ctx.fill()}else if(h.id==='pres'){ctx.fillStyle='#fff';ctx.fillRect(-3,-14,6,13)}else if(h.id==='doctor'){ctx.fillStyle='#f6ffff';ctx.fillRect(-3,-15,6,14);ctx.fillStyle='#dc4659';ctx.fillRect(9,6,7,3);ctx.fillRect(11,4,3,8)}else{ctx.fillStyle='#273d77';ctx.fillRect(-17,-18,34,7)}ctx.restore();ctx.fillStyle='#ffb457';ctx.font='bold 11px sans-serif';ctx.textAlign='center';ctx.fillText(h.name,heroX,585)}
function render(){ctx.clearRect(0,0,400,600);ctx.fillStyle='#070d1d';ctx.fillRect(0,0,400,600);for(let s of stars){ctx.fillStyle='#bac9e3';ctx.fillRect(s.x,s.y,s.r,s.r)}ctx.fillStyle='#253b50';ctx.fillRect(0,593,400,7);if(mode==='playing'){enemies.forEach(e=>{if(e.alive)drawAlien(e.x,e.y,e.hp>1?1.2:1)});drawBoss();drawHero();for(let b of bullets){ctx.save();ctx.translate(b.x,b.y);ctx.fillStyle=HEROES[chosen].color;if(b.shot==='bat'){ctx.font='19px serif';ctx.textAlign='center';ctx.fillText('🦇',0,5)}else if(b.shot==='syringe'){ctx.fillRect(-2,-14,4,23);ctx.fillStyle='#eaf7ff';ctx.fillRect(-5,-9,10,4)}else if(b.shot==='spear'){ctx.beginPath();ctx.moveTo(0,-17);ctx.lineTo(6,-5);ctx.lineTo(-6,-5);ctx.fill();ctx.fillRect(-2,-5,4,20)}else if(b.shot==='torpedo'){ctx.beginPath();ctx.ellipse(0,0,6,14,0,0,Math.PI*2);ctx.fill()}else if(b.shot==='plasma'){ctx.shadowBlur=12;ctx.shadowColor='#8dafff';ctx.fillRect(-5,-11,10,22)}else{ctx.beginPath();ctx.arc(0,0,6,0,Math.PI*2);ctx.fill()}ctx.restore()}for(let b of enemyBullets){ctx.fillStyle='#f36343';ctx.fillRect(b.x-3,b.y-7,6,14)}for(let p of particles){ctx.globalAlpha=Math.min(1,p.life*2);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,4,4)}ctx.globalAlpha=1}else{ctx.fillStyle='#ff9a30';ctx.font='bold 27px monospace';ctx.textAlign='center';ctx.fillText('MARCIANOS ATTACK',200,310)}}
function loop(t){let dt=Math.min(.035,(t-last)/1000||.016);last=t;update(dt);render();requestAnimationFrame(loop)}
function setKey(key,value){if(key==='ArrowLeft'||key==='a'||key==='A')keys.left=value;if(key==='ArrowRight'||key==='d'||key==='D')keys.right=value;if(key===' '||key==='Spacebar')keys.fire=value}
window.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' ','Enter'].includes(e.key))e.preventDefault();if(e.key==='Enter'&&!e.repeat){if(mode==='intro')nextComic();else if(mode==='select')startGame();else if(mode==='intermission')$('continue')?.click();else if(mode==='over'||mode==='victory')$('again')?.click()}setKey(e.key,true)});window.addEventListener('keyup',e=>setKey(e.key,false));window.addEventListener('blur',()=>{keys.left=keys.right=keys.fire=false});for(let [id,k] of [['left','left'],['right','right'],['fire','fire']]){let b=$(id);b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true;b.setPointerCapture(e.pointerId);if(k==='fire')shoot()});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>keys[k]=false)}
cv.addEventListener('pointermove',e=>{if(mode!=='playing'||e.buttons===0)return;let rect=cv.getBoundingClientRect();heroX=Math.max(24,Math.min(376,(e.clientX-rect.left)/rect.width*400))});comicScreen();requestAnimationFrame(loop);if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
